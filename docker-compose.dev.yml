version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hamyar-ops-postgres
    environment:
      POSTGRES_USER: opsuser
      POSTGRES_PASSWORD: opspassword
      POSTGRES_DB: hamyar_ops
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsuser -d hamyar_ops']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hamyar-ops-redis
    command: redis-server --requirepass opsredispassword
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'opsredispassword', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
