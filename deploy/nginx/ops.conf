# Rate limit zones (must be in http context — if already defined elsewhere, remove these two lines)
# limit_req_zone $binary_remote_addr zone=ops_api:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=ops_login:10m rate=5r/m;

server {
    listen 80;
    server_name ops.hamyar.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ops.hamyar.app;

    ssl_certificate /etc/letsencrypt/live/ops.hamyar.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.hamyar.app/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Hide nginx version
    server_tokens off;

    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Socket.IO (must come before /api/ to match /socket.io/)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Do not buffer websocket
        proxy_buffering off;
    }

    # Stricter rate limit on auth endpoints
    location /api/auth/login {
        limit_req zone=ops_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/auth/ {
        limit_req zone=ops_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # API → NestJS (port 3005)
    location /api/ {
        limit_req zone=ops_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Do not pass internal auth headers from clients
        proxy_set_header Authorization $http_authorization;
    }

    # Frontend → Next.js (port 3004)
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/hamyar-ops-access.log;
    error_log /var/log/nginx/hamyar-ops-error.log;
}
