# Include this from the nginx http {} context (e.g. /etc/nginx/nginx.conf):
#   include /opt/hamyar/ops/deploy/nginx/rate-limit-zones.conf;
#
# Then use ops.conf for the server block.

limit_req_zone $binary_remote_addr zone=ops_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ops_login:10m rate=5r/m;
